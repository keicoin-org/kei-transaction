name: CI

# The SDK moves other people's balances, and until this file existed nothing
# ran its 339 tests except a human remembering to. `kei-node` has had a build
# gate since M2; this is the same idea for the half that developers install.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows as well as Linux because this package is installed by people
        # building games on whatever machine they own, and path casing and
        # separators are where that difference actually shows up.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile`: a dependency that only resolves because the
      # lockfile got rewritten mid-install is a dependency nobody chose.
      - run: bun install --frozen-lockfile

      # A range that cannot select the version it will be published against is
      # how a consumer ends up with a second, older copy of core underneath it.
      # Cheap enough to check on every push rather than only at release time.
      - run: bun run release:check

      # Builds every package's project references on the way through, so this
      # also proves the workspace still compiles as a whole.
      - run: bun run typecheck

      - run: bun test

      # `release:check` reads manifests; this one reads the tarball. Packing runs
      # each package's prepack build, so a package whose exports point at dist/
      # files the tarball would not contain fails here instead of publishing
      # successfully and being unimportable (#158). It installs the whole packed
      # set together and imports every public entry, which is the closest thing
      # to a consumer install that does not require the registry.
      - run: bun run release:packs

  # `release:check` reads manifests and `release:packs` reads the tarball, but
  # neither can see that the version number in the tree no longer describes what
  # the registry already serves under that number. That is how
  # `@keicoin/core@0.6.0` was burnt: exports landed, the number stayed, and the
  # divergence only surfaced when someone attempted a release (#157). This
  # compares each packed artifact against the registry copy of the same version.
  #
  # Advisory, like the testnet job: it depends on the network and on npm packing
  # reproducibly across runner images, neither of which should be able to block a
  # merge. `scripts/publish.sh` runs the same comparison as a hard refusal, where
  # it is the last thing standing before an irreversible publish.
  registry:
    name: packed artifacts vs the registry (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run release:registry

  # M3 points the default network at a real testnet, so the SDK's own contract
  # against it can rot without any of the above noticing. It is best-effort
  # infrastructure with no uptime promise, so this reports rather than blocks.
  live:
    name: against the public testnet (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run test:m3-live
